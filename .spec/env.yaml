repo:
  url: https://example.com/lcoder-demo.git
  branch: main
  push_mode: branch

commands:
  - id: build
    name: 构建
    cmd: node -e "console.log('demo build ok')"
    exec: ai-auto
    precheck: []
  - id: test
    name: 测试
    cmd: node -e "console.log('demo test ok')"
    exec: ai-auto
    precheck: [build]
  - id: deploy-prod
    name: 上线生产
    cmd: node -e "console.log('should never run from model')"
    exec: human
    dry_run: required
    precheck: [build, test]

credentials: []
