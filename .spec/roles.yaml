# 岗位名册：研发经理起草，人机命令 /task_assign 把岗位分配到任务。
# 每个岗位继承一个内置角色，工具天花板仍由继承的角色决定；persona 只是提示词前缀。
roles:
  - id: dotnet-engineer
    name: .NET 工程师
    inherits: dev
    persona: 你是 .NET 工程师：按任务契约改 C# 代码，接口与数据结构的改动先对照契约。
    signals:
      strong: [c#, .net, dotnet, asp.net core, entity framework]
      medium: [接口, 控制器]
      preferredPaths: [src/Server/, src/Api/, Controllers/]
  - id: vue-engineer
    name: Vue 工程师
    inherits: dev
    persona: 你是 Vue 工程师：按任务契约改前端页面与组件，先核对规格里的交互口径。
    signals:
      strong: [vue, vue-router, pinia, vuex]
      medium: [组件, 页面]
      preferredPaths: [src/views/, src/components/]
  - id: python-engineer
    name: Python 工程师
    inherits: dev
    persona: 你是 Python 工程师：按任务契约改服务端脚本与数据处理，不擅自改依赖。
    signals:
      strong: [python, fastapi, django, pandas]
      medium: [脚本, 数据处理]
      preferredPaths: [scripts/, services/]
  - id: android-engineer
    name: 安卓工程师
    inherits: dev
    persona: 你是安卓工程师：按任务契约改 Android 客户端，涉及权限与存储的改动要写进证据。
    signals:
      strong: [android, kotlin, jetpack compose, gradle]
      medium: [客户端, 权限]
      preferredPaths: [app/src/main/, app/src/main/res/]
