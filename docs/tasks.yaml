      note: "B 级。用户 2026-11-06 贴截图说「这块遮罩好像有问题」，截图里提问弹窗的遮罩把对话窗口标题区切出一条灰带，压住标题、提示与会话上下文行。核实根因不在弹窗卡片，而在遮罩的几何。.pendingLayer 写的是 inset 56px 0 0 0，当年按固定 56px 标题高度切一刀，为的是盖住正文、保留标题栏可点；T-66 给标题区加了模型 chip、会话上下文行与提示后，标题区实际高度变成 76 到 105px，于是从 56px 到标题底边之间留下 20 到 49px 的半遮灰带，660px 卡片两侧还露出两条遮罩边。修法两步，不再依赖像素偏移。一、.pendingLayer 改成 inset 0 整窗铺满。二、.chatHead 加 position relative 与 z-index 30，高于遮罩的 z-index 20，标题区本身是不透明底色，层叠上去后自然把上半部分盖回去，标题无论几行都能对齐；CSS 注释写清为什么不能写固定偏移。证据：在运行中的工作树上用 CDP 注入新旧两版遮罩抓帧对比，旧版从窗口顶加 56px 处开始压暗标题（105px 标题被压掉 49px），新版标题整块保持亮度直到标题底边，遮罩正好从底边开始；注入的探针层已移除、标题内联样式已复位并复查。未验：真窗口手点——当前运行的是旧工作树产物，需按层重建 workspace 再刷新才看得到；也没有在截图那种单行提示的窗口下复看。"
