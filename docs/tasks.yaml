      note: "B 级缺陷（一处调用约定加浮层引用生命周期）。现象：用户配好钥匙后点某任务的「开始对话」，浮层显示「会话尚未就绪，请先打开仓库或新建会话」，消息发不出去也看不到回复。根因两处：一是 create() 只返回 SessionId，契约文档明写 retain 之后才借 binding，而 sendPrompt 直接调 ctx.sessions.binding(id)，刚建的会话还没进本地目录就是 undefined；二是浮层的读消息与订阅同样借 binding，没有引用就全是空。修法：sendPrompt 改 ctx.sessions.using，先 await reference.ready 再 prompt；浮层打开期间用 holdSession 持有一份引用、关闭时释放，读消息与订阅才借得到。两条各补一条单测。门禁 typecheck 5、vitest packages/lcoder 24 files 与 275 tests、oxlint 零告警零错，外壳产物已重打。桌面复验待重启：点任务、开始对话，应能看到回合开始并收到回复。2026-11-05 收口：修复后在真窗口点开始对话，对话能拉起（用户确认）；两条单测钉住 retain 与释放。"
