      note: "B 级缺陷，已收口。现象：全新 home 首启动后点「打开仓库」，按钮停在「正在打开…」超过十秒，workspaceIds 长期为空，人工与自动化都能复现，所以不是验收手段问题——本条早期两次改判（先判「人工可建成、属手段问题」，后判「整条 dsh-app 通道报错」）都已作废，取证过程与数据在 T-15。根因：宿主向操作系统查询文档目录那一步在本机挂住不返回（同一条命令在 Git Bash 里 0.17 秒返回），它卡住首启动的 initializeDefault，再因为注册表队列被一条永不 settle 的操作占死，把后面的 create 一起拖住。规避：在桌面 profile patch 里给 workspace-controller 配 documentsDirectory 指向一个真实存在的目录，不配就永久挂；仓内那份桌面 profile （apps/desktop/.desktop-build/development/home/profiles/desktop/cordis.patch.yml）已带这行，lcoder/RUN.md 桌面章节与 docs/PROJECT-RULES.md 及 .zh 的 §6 都把它写成启动要求，现象与判据记在坑档 W-08。实测证据：仓内 home 的单变量 A/B 显示配上后 22 个请求全部应答，workspace.json 从 227 字节长成 3 条工作区（default-workspace 建于 15:35:04、I:/Downloads/TodayBalanceQuery 建于 15:37:01、E:/Projects/LCoder 建于 15:47:24），每条各带一个 session，用户实测报「现在可以正常打开仓库了」。上游三条缺陷（documentsLookupTimeoutMs 的 10 秒上限没兜住等待、失败静默没有错误码与堆栈、一条 pending 永久占死注册表队列）留在 T-16 继续跟进，本仓不修，是否对外发声等用户拍。取证材料归置（C 级一次性整理，不单独上板）：仓根散落的 .probe-desktop 系列日志与 lcoder/web.log 统一移到 lcoder/logs/，.gitignore 加一行 lcoder/logs/。另纠正一条历史读数：本条早期记的「宿主崩过一次、exited with 4294967295」发生在 dev.ts 被主动 Stop-Process 杀自己实例的同刻，同码也出现在我们每次正常停实例的日志尾部，所以那条更像杀进程产物而不是崩溃；当时引用的 crash-*-host.log 所在目录现在electron-user-data/logs 下是空的。"
