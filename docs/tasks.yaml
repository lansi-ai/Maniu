      note: "真产品路径复现（2026-11-04 干净环境单实例）。先立环境判据再测功能——主仓 dev:desktop 起唯一实例（electron 主进程 1 个、宿主子进程存活、日志有 ready URL 行，指向 127.0.0.1:62854），渲染进程 reload 后采集 22 秒得零网络失败与零控制台报错，plugins/events 只有 request 与 HTTP 200 两条事件、没有 closed 或 failed，即事件流保持打开。用户手点 LCoder 菜单填 E:/Projects/LCoder-target-demo 点打开仓库，15 秒后外壳出现「打开仓库超时：登记没有返回。（workspace/create）」，即 T-17 文案在真机路径生效。同一次动作落盘侧零变化——主 home 的 storages/workspace.json 停在 mtime 11:05:46、227 字节、workspaceIds 为空，宿主日志 .probe-desktop.log 共 140 行、无任何 workspace 相关错误或抛错，点击之后再没新增任何一行。定性两次作废，都记下来免得再犯。第一次作废「整条 dsh-app 通道报错」，被 arguments-invalid 与 session/list 秒回否掉。第二次作废「上游 workspace 服务在全新 home 首启动即挂」——那条靠自造 RPC 帧直发 api/workspace/create，帧形缺真实客户端建立的流与会话上下文，服务端等一个永不到来的东西而挂住是合理的，不能当产品路径证据；桌面与 web 两种宿主里同帧形都无应答，只说明帧形不可信。本轮改用上游原生 UI 走真路径——纯净 master 检出的 worktree .worktrees/upstream-probe（树里没有任何 @lcoder 包）、全新 home .probe-home-3083、端口 3083，除上游自带的目录选择器测试覆盖 apps/web/tests/pin-browse-picker.overlay.yml 外不加任何 patch（默认目录选择后端是系统原生对话框，页面驱动不了；这条覆盖只替换取路径的 UI，create 仍走上游 WorkspacePicker 的 adoptDirectory 到 workspaces.create）。结果同一症状——添加工作区、路径编辑器提交靶仓、选中行、点打开，UI 停在 busy（打开与取消同时置灰）到第 113 秒仍未解除，那个 home 的 storages/workspace.json 从启动起停在 227 字节、mtime 13:53:09、workspaceIds 为空、workspaces 表为空，宿主日志只有 2 行、零报错。所以挂死落在 workspace 服务与宿主这一层，与桌面宿主、dsh-app 代理、我们的 profile patch 与 @lcoder 挂载无关；是否对外发声、是否申请进接触面、还是先绕开，请用户重拍，本条不代定。旁支假设已证伪，一并记下防止重复排查——Documents 目录查找（同一条 powershell 命令 0.17 秒返回）、sessions 目录缺失（建空目录后仍挂）、路径写法与仓库形态（正斜杠反斜杠、有无 git 有无 .spec 全都同样挂）、profile 形状、多实例干扰（本轮单实例照样复现）。取证方法的更正写进坑档 W-07。2026-11-04 之前的过程记录（差异表、inspector 活跃请求恒为 1 且无 Timer、异步栈 0 帧）保留在提交历史里，不再重复。2026-11-04 代码读数与排除项（不改判，只登记原因空间）。已排除三条。一是 recoverPendingMutation 不是首犯，packages/workspace/workspace/src/index.ts 的实现在 pending 为 undefined 时第一行就 return，而我们的存储里没有 pending。二是队列不会被失败毒化，同文件 enqueueOperation 把 operationTail 挂在连 rejection 也释放的 then 上。三是装配层不是首犯，纯净上游检出里我们的东西根本不存在，原生 UI 仍建不出。剩两条嫌疑与各自验证方法。主嫌是首启动的文档目录查询——packages/api/workspace-controller/src/index.ts 的 initializeDefault 用 AbortSignal.timeout 包住 defaultWorkspaceDirectory，win32 分支经 runNativeCommand 起 powershell.exe 问文档目录，documentsLookupTimeoutMs 默认 10000，同文件 Config 里就有 documentsDirectory 覆盖项，配上它等于跳过问 OS 这一步；验证办法是在机器本地 profile 给 workspace-controller 配死一个已存在的文档目录再重启单实例，看用户手点的 create 能否落盘。次嫌是 listStoredHeaders——registry 的 initializeDefault 在队列里先 await listStoredHeaders 才走到 resolveDirectory，验证办法是配死目录后看启动链是否仍无应答。方法与环境两条实测补充。其一，之前那次 0.17 秒是 Git Bash 直接跑命令，不代表宿主进程内同一条命令的耗时；且宿主 realm 里 require 与动态 import 都不可用（Runtime.evaluate 分别报 require is not defined 与 ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING），所以宿主内部行为不能靠 evaluate 调模块复现，只能观察宿主持有的子进程树与活动资源，或用落盘数字反推。其二，14:20 采样时宿主（PID 31048）持有子进程为 0，系统里没有归属它的 powershell 残留。再补一条与两条嫌疑都相关的读数：registry 的 Service.init 也 await listStoredHeaders 并提交 initialized 标记，而我们见过启动时 workspace.json 已写入该标记，说明启动那次列表读完成过——这条削弱次嫌，但不排除 initializeDefault 调用时的那一次，仍需实测。主嫌验证办法已执行一半并带回数据：机器本地 profile 给 workspace-controller 配死 documentsDirectory 后重启单实例（渲染 9222、宿主 9230，宿主 PID 5524），采集渲染进程自己的流量，23 个请求里 22 个 HTTP 200 且完成（含 session/list、agentPresets/list、modelCatalog、account 三项），只有 api/workspace/initializeDefault 无应答，plugins/events 是 200 且未结束即流保持打开，零网络失败；同一时间窗里 105 次采样宿主持有子进程恒为 0、没有出现任何归属宿主的 powershell，宿主活动资源恒为 1 个 FSReqCallback 且 Timer 数为 0。配死目录后 initializeDefault 仍无应答，而它按代码顺序是先 await listStoredHeaders 才到 resolveDirectory，所以文档目录查询不太可能是第一现场，嫌疑移到列表读与队列本身。落盘侧照旧零变化：workspace.json 仍 227 字节、mtime 11:05:46、workspaceIds 为空，C 盘用户 Documents 下没有 deepseek-harness 目录。另记一条代码读数供下次实验设计用：initializeDefault 的资格判定用或运算短路，state.workspaceIds 非空或有活的 sessions 时会在 await listStoredHeaders 之前就返回 undefined，因此这次挂住的前提是 home 既无工作区也无会话，与「已用过一次的 home 里手点能成功」并不矛盾。版本假设已由 git 判掉，不再作为待验证项：rc.5 到 upstream/master 之间只有 6 个提交，改动面全在 packages/experimental、packages/client、apps/web、pnpm-lock、THIRD_PARTY_NOTICES 与一个 lint 基线，workspace、storage、session、gateway、typert 零改动，所以「上游在两版之间回归」不成立。另记一条取证环境的更正：上面那次配死 documentsDirectory 的桌面判别跑在 ~/.dsh 上，属违规操作——按 T-19 的隔离约束，DSH_HOME 与 profile 必须在仓内；改动已还原并删备份，该轮带回的数据仍然可用（客户端 23 个请求里 22 个应答、只有 initializeDefault 无应答、宿主 105 次采样零子进程零 powershell、资源面 Timer 恒为 0），但重跑要在仓内 home 上做，并且要用 --dump-config 证明配置真的命中了 workspace-controller 那一行。第 3 步两组数字已带回，主嫌在本轮被证实。配前（纯净上游 master、仓内 home .dsh-home-3084、不挂 LCoder、只带上游自带的目录选择器测试覆盖）：客户端自己发出的请求里除 api/workspace/initializeDefault 全部 200，那条一直 pending；workspace.json 227 字节、mtime 14:56:18、workspaceIds 为空，那 227 字节是启动时写的 initialized 标记；C 盘用户 Documents 下没有 deepseek-harness 目录，说明查询从未走到建目录那一步。配后（同 worktree 的另一个仓内 home .dsh-home-3085，profile patch 给 workspace-controller 配 documentsDirectory 指向仓内 .dsh-docs，并用 --dump-config 打印出该行的 config 证明命中）：api/workspace/initializeDefault 返回 HTTP 200，workspace.json 涨到 1905 字节、mtime 15:09:02、workspaceIds 四条、defaultWorkspaceId 有值、表里出现 default-workspace 且路径指向 .dsh-docs/deepseek-harness/default-workspace，目录确实建出来了，随后 session/create、commands/list、skills/list 全部 200，侧栏渲染出工作区行。跳过问操作系统这一步之后整条链跑通，所以首犯是文档目录查询，且带本机特异性。驱动侧我自己出一趟事故要在台账留痕：在原生目录选择器里连发键盘 Enter 与点击，额外登记了三个我并没有选的路径（AppData 的 Roaming、INetCookies 与 E:/Projects/AStock），每个各带一条会话；按代码 create 只 realpath 加 stat 已存在的目录、不写内容，所有登记与 session 数据都落在那个仓内 home 里，而我真正选的靶仓 LCoder-target-demo 反而没被采纳。教训是驱动原生选择器要一次一个动作、每个动作后核对 aria-current 选中行。还没证明的两件事分开记：一是桌面端那次配了同样的 documentsDirectory 却没跑通，但那次既没有 --dump-config 证明命中（CLI 拒绝 profile 名 desktop），又违反 T-19 跑在 ~/.dsh 上，要在仓内 home 重做；二是 documentsLookupTimeoutMs 的 10 秒上限为什么没有把这条等待收口——宿主资源面 Timer 恒为 0、也没有归属宿主的 powershell 子进程残留，这属上游缺陷还是本机特异性，等用户定了路线再往下追。"
