      note: "人工可复现，非验收手段问题。用户截图里 DevTools 控制台原文四行：「POST dsh-app://app/api/workspace/initializeDefault  net::ERR_UNEXPECTED   rpc.ts:35」「POST dsh-app://app/api/workspace/create             net::ERR_UNEXPECTED   rpc.ts:35」「GET  dsh-app://app/plugins/events                   net::ERR_FAILED 200 (OK)   events:1」「Failed to load resource: net::ERR_FAILED            events:1」。关键点是启动时该发的 initializeDefault 也 ERR_UNEXPECTED，连事件流都 ERR_FAILED，所以不是 create 永不 settle，而是整条 dsh-app:// 后端通道报错；Electron Security Warning (Insecure CSP) 与本条无关。现象还包括弹窗列表显示「还没有工作区。」、按钮停在「正在打开…」。11 月 3 日用户在同一个主窗口手点曾成功建出 LCoder-onboard-demo（当时 profile 是删除前原状），所以这是新引入的回归。2026-11-04 实测二分（只读 CDP 网络探针，无点击）：两个实例的宿主都活着、ready URL 有、直接 GET 宿主端口返回 303；主实例 reload 后 27 请求 0 失败 25 应答，worktree 实例 30 请求 0 失败 29 应答，两边都发出了 api/workspace/initializeDefault 且探针都没抓到它的 HTTP 应答。但两个 home 的 storages/workspace.json 都是 227 字节、global.initialized 为 true、workspaceIds 为空，说明 initializeDefault 实际完成过并写了标志，所以「整条 dsh-app 通道报错」这个初判不准，准确说法是 create 路径不落地（下面 11 点后的复测把这句再收窄一次，以复测为准）：主实例今天有 create 请求且用户控制台报 ERR_UNEXPECTED、工作区表仍为空；worktree 实例昨天两次合成点击同样不落地。差异表：package.json 只有 link 路径不同；pnpm-workspace.yaml 与 cordis.yml 完全相同；patch 差 3 个偏好条目（agent-default-model、ui-settings-general、ui-settings-account）；两边 bundles 都不含 readonly preset；主 profile 的 node_modules 是我用 --ignore-scripts 装的，worktree 那份是正常安装；两个 home 都没有 sessions 目录。2026-11-04 11 点后复测（单一实例、页面内直发 RPC、每调用 15 秒超时，不是点击）：参考路由 session/list 立即返回 HTTP 200 且 ok 为 true（items 为空），证明 dsh-app 通道与鉴权都正常；workspace/create 三种输入全部 15 秒无应答——正斜杠靶仓、反斜杠靶仓、以及已知 git 仓 LCoder-onboard-demo 一样挂，所以「非 git 或无 .spec 被拒」不成立，失败与输入形态无关；workspace/initializeDefault 同样无应答。profile 形状已由用户复核为两边一致，不再是嫌疑。已证伪的假设是原生 Documents 查找卡住——同一条 powershell GetFolderPath 命令 0.17 秒返回 C 盘用户 Documents。当前最像的解释是 registry 变更队列被一个永不 settle 的操作占住，候选是启动期 initializeDefault 在 listStoredHeaders 或 sessions 相关等待上挂住（sessions.list 本身能应答）。再往下要名字就得二选一：在宿主 inspector（主实例 9230）上取挂起栈，或按 R-01 先登记接触面再给 WorkspaceCommands 加临时错误输出。2026-11-04 12 点后两条独立结论（按用户口径分列，不再混写）：结论一，通道没坏——arguments-invalid 能秒回、session/list 秒回且 ok 为 true，坏的是 workspace 命名空间的调用永久 pending，且会锁死后续同队列操作。结论二，三种输入全挂，「非 git 或无 .spec 被拒」作废，失败与路径写法与仓库形态无关。inspector 只读差分（宿主 PID 29072，端口 9230）：静置、create 发出后 4 秒、abort 之后三次采样，活跃请求恒为 1 个 FSReqCallback，资源统计恒为 FSReqCallback 1、FSEventWrap 5、TCPSocketWrap 6 到 7、TCPServerWrap 1、PipeWrap 3，且没有任何 Timer 资源；所以那条永不 settle 的等待背后没有 I/O 在等，是一个没人 resolve 的 promise，不是卡在 native fs，也不是超时器丢失。命名它需要上游插桩或堆分析，按指示先回来上报，未改任何代码，未 mkdir 任何目录。2026-11-04 用户批准的 sessions 判别（c 案）已做完：建空目录 ~/.dsh/sessions 后重启单实例，直发 create 三种输入仍然 15 秒无应答，是二元结果里的「仍无应答」；workspace.json 的 mtime 仍是 11:05:46、227 字节、defaultWorkspaceId 为空，C:/Users/Administrator/Documents/deepseek-harness 不存在。所以 sessions 目录缺失不是原因，下一个嫌疑只能是那条 promise 本身，按口径轮到堆快照（b 案），等批准。2026-11-04 全新 home 判别器（一次性 web 实例，不挂 LCoder、不 link @lcoder 两条包，DSH_HOME 用 Windows 形式指向 .worktrees/t10-onboarding/.probe-home；只作判别，不作验收路径）：workspace/create 15 秒无应答、放宽到 60 秒仍无应答；workspace/initializeDefault 15 秒无应答；对照组 session/list 秒回且 ok 为 true、items 为空。新 home 只有 .anonymous-user-id、.credentials.yaml、profiles/web、storages/workspace.json，没有 sessions 目录；workspace.json 的 initialized 为 true、workspaceIds 为空、mtime 13:02:49；web.log 全文 3 行，没有任何 workspace 相关抛错。判定：上游 workspace 服务在全新 home 首启动即挂，与桌面宿主、dsh-app 代理、我们重建的 profile、@lcoder 挂载全部无关。我们侧唯一可用规避是 T-17 的超时加可区分文案，根治在上游。"
