      note: "T-15 定性（2026-11-04，三组单变量实测）。首犯是宿主向操作系统查询文档目录那一步——packages/api/workspace-controller/src/default-directory.ts 的 win32 分支经 runNativeCommand 起 powershell.exe 取 MyDocuments，在本机会挂住不 settle（同一条命令在 Git Bash 里 0.17 秒返回），属本机特异性；配死目录后整条链跑通。上游侧三点观察按 T-16 的收口只能记成设计特征与未证实项，不是缺陷定性：一是 documentsLookupTimeoutMs 的 10 秒上限是否兑住这次等待未经证实（当时只观察到宿主资源面 Timer 恒为 0、也没有归属宿主的 powershell 子进程）；二是失败不发声，宿主日志零报错、零 workspace 相关行；三是一条永不 settle 的操作永久占死注册表队列，把后续 create 一起拖住（详见 T-16）。实测数据三组。仓内 web 判别（纯净上游 master 检出 .worktrees/upstream-probe，不挂 LCoder，只带上游自带的目录选择器测试覆盖）：配前 home .dsh-home-3084 里 api/workspace/initializeDefault 一直 pending，storages/workspace.json 227 字节、mtime 14:56:18、workspaceIds 为空；配后 home .dsh-home-3085 用 --dump-config 证明 documentsDirectory 命中，initializeDefault 返回 200，workspace.json 涨到 1905 字节、mtime 15:09:02、workspaceIds 四条——default-workspace 指向 .dsh-docs/deepseek-harness/default-workspace、Roaming 指向 C 盘用户 AppData 下的 Roaming、INetCookies 指向其下 Microsoft/Windows/INetCookies、AStock 指向 E:/Projects/AStock；后三条是我驱动原生目录选择器时连发 Enter 与点击误采纳的，不是所选目标，我真正选的靶仓反而没进表。桌面单变量 A/B（仓内 home apps/desktop/.desktop-build/development/home，DSH_HOME 与 userData 都在仓内，只改 profile patch 那一行）：基线里 initializeDefault 与 create 两个调用都无应答、workspace.json 227 字节、mtime 15:28:38、workspaceIds 为空；配上后 22 个请求零无应答零失败、workspace.json 758 字节、mtime 15:35:05、workspaceIds 一条、defaultWorkspaceId 有值、default-workspace 落在 development/docs 下。此前逐个作废的定性一并留档以免重犯：整条 dsh-app 通道报错、非 git 或无 spec 被拒、上游服务在全新 home 首启动即挂（那条靠自造 RPC 帧，方法无效），以及 id 未命中桌面 composition 这个猜测——桌面 profile 的 bundle 链就是 base 加 web-app，workspace-controller 这个 id 在桌面 composition 里存在，猜测不成立。仍未解释的不一致记在这里：上一轮在 ~/.dsh 那个 home 配了同样配置、也重启过，仍然挂，与本轮桌面结果矛盾，可疑点在该 home 的既有状态（建过的 sessions 目录、已写的 initialized 标记与凭据），但复现它要再借本机安装态，已被 T-19 禁止，所以留作未解。规避已入文档：lcoder/RUN.md 桌面章节、docs/PROJECT-RULES.md 与 .zh 的 §6、坑档 W-08。路线（提上游 Issue / 申请进接触面 / 就此绕开）等用户拍。2026-11-04 收口：定性完成，规避已入文档（lcoder/RUN.md 桌面章节、docs/PROJECT-RULES.md 与 .zh 的 §6、坑档 W-08），挂载迁进仓内 home 与其补证过程记在 T-13；T-16 已按用户判定收口为上游无缺陷——队头不自愈属设计特征，超时未兑住未经证