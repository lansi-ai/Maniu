      note: "A 级（换渲染面与交互通道）。用户 2026-11-05 真窗口反馈三条：一是浮层没有格式化输出、思考过程没隐藏、需要人选择的场景（审批与提问）没有弹窗；二是浮层不能放大，要两档，普通放大居中不占全屏、最大化占满应用；三是会话弹出时任务面板不占满窗口（截图里看板只顶在上半部，右侧与下方大片空白）。另有一条同源缺陷：截图里出现的英文 Current runtime context 是注入上下文被当成用户消息画出来了——messagesFromEntries 只按事件类型取文本，没有按 source.kind 过滤。根因：浮层是我们自画的（cursor 只取 user/message 与 assistant/message 的纯文本），没有用上游的会话渲染与审批面。方向首选复用而不是重写：先核上游 packages/client/ui-conversation 与 ui-trajectory 怎么渲染 markdown、思考折叠与审批卡，以及 user-approval 与 user-questions 两个通道在客户端怎么挂；能在浮层里嵌上游渲染最好，嵌不了再评估自实现 markdown 加折叠与审批条的成本。布局三件同时做：任务板撑满可用高度、浮层普通放大居中不遮全屏、最大化占满应用，尺寸与位置进配置不写死。验收只认桌面真窗口手点。2026-11-05 拍板结论：路线=浮层加上游原语自造。一、正文用 MarkdownText、思考用 DisclosureRow，不自写 markdown 解析器；二、审批与提问读 pendingInteraction 并调用上游 answer()，不另造事件通道，多题、多选、plan-review 逐项覆盖并钉单测；三、保留浮层与两档放大，普通档居中不占全屏、最大化占满应用、任务板撑满可用高度；四、注入上下文按 source.kind 归类，默认折成一行可展开，折叠行文案中英双份，真实用户消息照常展开、切换后可展开并用单测钉住。实现与证据 2026-11-05：消息投影按 source.kind 分流（只有 user 画成用户气泡，其余 user/message 与 developer/message 折成上下文行），助手按 text/reasoning 拆块；正文用 MarkdownText，思考用 DisclosureRow 折叠；审批与提问读 sessionStatus.pendingInteraction，浮层内弹卡并调用上游 answer；普通档尺寸进 chatWindow 配置（默认 760x640），最大化占满应用；任务板窗口撑满浮层。门禁 typecheck 5 项全过、vitest packages/lcoder 26 文件 291 例（含同回合过程分组、注入折叠展开、多题多选、plan-review 回传）、oxlint 0 错 0 警、test:docs 21 项全过、build:artifacts 8 项全过。真窗口手点（CDP 驱动）：markdown 标题/列表/行内代码、过程组头展开、上下文折叠、普通档居中、最大化与恢复均过；审批与提问弹窗的渲染与 answer 回传由组件测试覆盖，live 弹窗未手点——仓内 home 没有模型钥匙，待配置后补验。2026-11-05 过程收敛结论：上游 ui-trajectory 的 TrajectoryGroupHeader、TrajectoryTimeline、TrajectoryTable、TrajectoryView 均未从包入口导出，TrajectoryView 还依赖 slot props 与 trajectory target，浮层无法嵌入；按允许的兜底改为同一回合的思考与工具收成一个 DisclosureRow 组头，展开为逐条列表（思考、工具名、状态、参数），答复 Markdown 另起一条不折进组里。组头文案执行工具 N 次与思考 N 段进中英词典。证据：新增同回合分组、两回合分隔、组头计数与展开列表单测，vitest 291 例；真窗口打开 T-02 回合（21 次工具、11 段思考）看到 1 行组头，展开为时间线列表，下方答复 Markdown 正常。无钥匙未新跑回合。"

