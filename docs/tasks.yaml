      note: "B 级（若需要 Task schema 加会话关联则升 A 并先与用户确认）；分支 lcoder/t24-card-status，worktree .worktrees/t24-card-status，桌面 inspector 端口登记表 main 9349 / renderer 9342 / host 9350。现状已核：客户端 SessionSnapshot 暴露 sessionId、pendingSubmissions、running、subagent、removed、openState、openError、hasMore、loadingOlder、promptError、blank、lastAgentError、promptAttempted、awaitingFirstTurn（packages/api/session-controller/src/client/contract/snapshot.ts:69-91，buildSnapshot 见 sessions/session.ts:925-951）；外壳现在只用 useSessions(state => state.byId) 行上的 cwd 与 running 两项（workspace/src/client/shell/Shell.tsx:118、154-155、161），细粒度字段要走 ctx.sessions.binding(id).session.getSnapshot()；卡片渲染段 renderColumn 在 Shell.tsx:348-375，只画编号、分级、标题、规则标签与工具面文案，没有任何对话状态；任务与会话目前是唯一对应（工作区取 sessionIds[0]，Shell.tsx:151-153），Task schema 里没有会话关联字段——这条是本任务真正要先定的口径。范围：定出任务到会话的映射判据并显示到卡片上（在跑、等待首个回合、空闲、失败、已完结），失败取 promptError 与 lastAgentError。验收只认桌面端手点。实测记录（桌面真窗口、本线端口 9349、9342、9350，靶仓 E:/Projects/LCoder-onboard-demo 铺了三条任务 DEMO-01、02、03）——打开仓库后 storages/workspace.json 里该工作区 sessionIds 只有一条，项目切换面板同屏显示「1 会话」，三张卡片共用这一条会话，任何取自会话的状态天然是项目级、全 board 一个样；会话日志头只有 id、createdAt、cwd、isSeeded、delegationDepth、agentPreset 六个字段，没有任何任务关联位；卡片状态可取的三条通道——useSessions 的 byId 行最便宜（含 running、blank、title、cwd、updatedAt），useSessionStatus 全局 seat 零装配且覆盖每个列出的会话（running 由宿主 api-session/status 推流、另有 pendingInteraction 与 completionUnread，不需 bind 也不开历史），binding(id).session.getSnapshot() 独有 awaitingFirstTurn、promptError、lastAgentError 但只对已 retain 的会话存在（N 张卡等于 N 次开历史）；无 DEEPSEEK_API_KEY 时「开始对话」按钮实测为 disabled、起不了回合，所以「在跑」与失败态字段本次没取到实测，需用户自己 export 钥匙重启实例补测，不许拿空闲冒充在跑；另一处与预期不符——start:desktop 的启动日志里看不到 kernel 那行十工具注册（宿主子进程 stdout 不并入这份日志），但会话头 agentPreset 是 lcoder，可证 profile patch 与 kernel 装配都生效，判 kernel 死活要看会话头而不是日志行。口径 2026-11-04 曾拍为「会话标题精确等于任务号」加 session.rename，2026-11-05 两次改判收口——归属权威定为 .spec/tasks/<ID>.yaml 的 session 字段、标题降回纯显示；「点开始对话，复用该任务已认领会话、没有就在同仓新建并指名角色、调 /task_bind 认领、重读投影」整套手势连同命令与字段一起归 T-25（那边已建完并在真窗口实测过），本线只做任务卡片的状态显示，不新增 kernel 写盘者，也不留第二套建会话或绑定的代码。改判原因：可被人改写的显示字段当外键违反 .spec 单源；同一手势两条线各写一份必然漂移，所有权给已实现且实测过的一方。卡片只标态，失败的具体 code 沿用 T-22 的浮层就地提示，不为取失败态逐卡 retain。分级 B——外壳只读投影里已有的字段。落点在 packages/lcoder 与装配层——纯判定 task-session.ts 的 claimTaskSession 按「字段与会话标识精确相等」认领（字段缺省或空串算未绑定、指向名册外的会话不冒充认领成功、标题不参与判定），taskCardStatus 折未开始、在跑、等你回答、等首个回合、失败、空闲六种态；投影 TaskRow 读出 session 字段（T-25 若已带出同一字段，等它进 baseline 后 ff 再接，不写第二份解析）；装配层只留 readSessionFlags 取两个快照位，subscribeSession 同时挂事件窗口与会话快照；外壳用 useSessionStatus 全局 seat 取每会话 running 与 pendingInteraction（零 retain、零开历史）；文案进词典中英双份，配色新增 --lc-status-warn 与 --lc-status-danger 两个 token 且浅色深色各自定义。未验证项——无 DEEPSEEK_API_KEY 时开始对话按钮实测为 disabled，「在跑」与「失败」两态至今没取到实测，不许拿空闲冒充在跑；认领折取、快照读不到退回未开始、订阅收回三条走单测覆盖，需用户 export 钥匙后按点击清单在真窗口手点验收。交出去的一条实测事实（本线已删掉相应代码，T-25 的建会话手势要用）——会话必须按 workspaceId 建，只给 cwd 时宿主不走 attachSession 那条分支（packages/api/session-controller/src/commands.ts 的 create 仅在 workspaceId 分支调 workspace.attachSession），会话建在目录里却不进工作区名册，卡片永远认不到；路径可以先用 workspaces.create 的幂等语义解析回同一个工作区。真窗口已验到的部分——三张卡各带一个状态药丸且都读作未开始（没有绑定字段时判定不冒充知道），浅色与深色下三种配色都核过可读（用 DOM 临时染色核 token，不改代码），看板、项目切换、浮层与 T-22 的无模型提示无回归。仍未验到的是真窗口里的「在跑」与「失败」两态，以及 T-25 的 /task_bind 落盘后本线卡片能否认出同一条会话——要等它进 baseline、本线 ff 之后一起验，需用户 export DEEPSEEK_API_KEY 后手点确认。"


