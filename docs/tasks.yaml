      note: "A 级；补齐 PRD 风险首条「签署通道缺失」。现状缺口三处。一是 PROJECT-RULES §1 写明 contract_sign 永不注册为模型工具、只有人可签，但宿主侧没有任何签署入口，sig 字段只能手改 YAML。二是 spec-tools 的 contractHash 算完只出现在工具返回值里，落到文件后无人复算，sig.hash 形同装饰。三是外壳看不见契约（归 T-21）。范围（微契约）：输入是命令名后的任务编号，输出是写进 .spec/contracts/<id>.contract.yaml 的 sig，异常边界为无规格根、无契约文件、已签且正文未变、正文在签后改过四种，MVP 不做撤签与批量签。落点：新命令 contract_sign 走 dsh-commands 的人机命令面（命令名匹配其小写正则，处理器收到 agent 后按 agent.session.header.cwd 解析规格根，与工具同一来源）；宿主复算正文哈希后写 by 为 human、at 取执行时刻、hash 为复算值；已签且哈希相同判为重复签署并拒绝，哈希变了则重签换新值。不新增模型工具、不进 SURFACE、不改状态机——状态流转仍手写 YAML，与需求确认口径一致。同期把 P3 接上哈希校验，checkP3 增加正文哈希参数，签名哈希与正文哈希不符即为违规，task_close 复算并传入，让「签署后正文不可变」从注释变成门禁。装配代价：命令面由 base bundle 提供（packages/bundle/base 装 dsh-commands），kernel 的 inject 增 commands，代价是装配里缺命令面时整个 kernel 不激活，桌面、web 与 CLI 都组 base 所以不受影响。2026-11-04 落地四处：新文件 kernel/contract.ts 收拢契约读写与复算（contractPath、contractHash、loadContractFact、saveContract），spec-tools 与 task-tools 改用它；新文件 src/commands/contract-sign.ts 是命令本体，按结构声明命令面形状、不依赖 dsh-commands 包；checkers 的 P3 改吃 ContractFact，签名哈希与正文复算值不符即判违规；plugin.ts 的 inject 增 commands 并在 selfCheck 行点名命令。门禁 typecheck(5)、vitest(18 files / 169 tests)、oxlint(packages/lcoder 0 error)、test:docs(21)，双语 pairing 哈希已 --write 重录；两个包重新 bundle，产物里 contract_sign 命中 kernel 8 处与 client 2 处。桌面端到端与真窗口回执仍未取，本条保持 doing。2026-11-05 收口，真窗口两笔人签都取到了。用户在桌面端亲手点「签署契约」，落盘两处均为 by 是 human，时刻分别 2026-11-05T02:01:51.930Z（E:/Projects/LCoder-onboard-demo 的 DEMO-01）与 2026-11-05T06:17:12.454Z（E:/Projects/LCoder-target-demo 的 T-02）；对这两份正文复算 contractHash（去掉 sig 字段）与落盘 sig.hash 逐字符相等，loadContractFact 判 sig.hash 等于 bodyHash，即 P3 认这两笔签。签后面板显示「人签于」且签署按钮消失，重开页面仍在——状态来自文件重读而不是点击记忆。签署不改任务状态，下一步由 T-29 的「推进到已签约」承担并已在真窗口点过。命令面只在人机侧，四个角色表都不含 contract_sign（单测钉住）。"
