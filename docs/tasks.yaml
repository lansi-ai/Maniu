      note: "B 级；2026-11-04 用户在桌面端点「开始对话」后没有任何回音，靶仓会话日志解出来只有 session header 一行、零条 user/message。已核实现状：准入阶段被拒时外壳会显示（sendPrompt 把 ok:false 抛成 chatError），但缺模型凭据时提示其实被接受——packages/api/session-controller/src/commands.ts 的 prompt 只做内容与附件校验就 agent.followup() 入队，user/message 要等回合认领输入才落日志；真失败发生在 agent 侧，经 agent/error 转发成 api-session/error，落到客户端会话快照的 lastAgentError（packages/api/session-controller/src/client/sessions/session.ts:944 起），而同文件的 promptError 记准入失败。外壳只读 eventSource 的事件条目，从不读这两个字段，所以现象是「发了，什么都没发生」。上游已有可用信号：session/modelCatalog 返回 routableProviders、groups 与 failures，另有 session/model-unavailable 与 session/provider-models-unavailable 两个码。范围（用户 2026-11-04 拍定两条）：一、只提示去哪儿配，不碰凭据面——外壳进项目即查 modelCatalog，routableProviders 为空且每组 models 也为空时在看板顶部与对话浮层就地提示「宿主侧没有可用模型」，写清 DEEPSEEK_API_KEY 或仓内 home 的 .env、改完要重启；工作台不录入密钥、不接 credentials 面。二、没有可用模型就禁用发送，原因挂在按钮上；凭据后补由 llm/models-updated、llm/adapters-updated 与 credentials/record-updated 触发重查来解锁。三、把快照的 promptError 与 lastAgentError 显示到浮层，不再静默。落点三处：新增 client/model-status.ts 放纯判定（目录有无可用模型、错误条目归一成词典键加细节），client/index.ts 的 inject 增 remote.session 并注入三个回调，Shell.tsx 接一条 modelReady 状态与两处提示面；文案进词典中英双份。验收只认桌面端手点。2026-11-04 已落地：判定与提示分三处——新增 client/model-status.ts 放纯判定（catalogHasModel、statusFromCatalog、statusOfFailure、noticeFromSnapshot），client/index.ts 注入 checkModels、subscribeModels、readSessionNotice 三个回调且 inject 增 remote.session，Shell.tsx 接一条 modelStatus 状态加看板横幅与浮层提示，empty 时禁用「开始对话」「立项分析」与浮层发送并把原因挂在按钮 title 上；op 为 stop 的 promptError 不显示，本壳没有停止动作。unknown 只说不清、不禁用，避免把查询故障说成配置缺失。门禁 typecheck(5)、vitest(19 files / 183 tests)、oxlint 对 packages/lcoder 0 error、test:docs(21)，双语 pairing 已重录，workspace 已重新 bundle。补上凭据后由 llm/models-updated、llm/adapters-updated 与 credentials/record-updated 触发重查解锁。桌面端到端未取（本机仍无模型凭据），本条保持 doing。"

