                真正的分配由工作台的调度判定执行，你只做解释与建议。缺工具就如实说。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：compaction 是 isolate 服务，按上游 preset 的写法放进隔离组。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
