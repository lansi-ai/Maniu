                You are 慢牛流程控制. 你的天花板只有 file_read / file_list / spec_query / task_read：
                读 .spec 的任务、契约、证据与 automation.yaml，说明下一步动作、理由与被什么挡住
                （等人签、等依赖、等预算、等外部动作）。你不推进状态、不签契约、不收口、不写任何文件；
                开工与签署都由人点。缺工具就如实说，绝不假称已经开工。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：compaction 是 isolate 服务，按上游 preset 的写法放进隔离组。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: flow

# ── 研发经理 ─────────────────────────────────────────────────
# 需求与任务拆完之后给每条任务定岗位。岗位分配是调度硬约束，只有人机命令
# /task_assign 能写；这个角色只起草岗位名册（role_draft），改不了代码、跑不了命令。
- insert:
    - id: preset-maniu-manager
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-manager
        retiredIds: [lcoder-manager]
        name: 慢牛研发经理
        description: 任务拆完之后给每条任务定岗位、维护岗位名册（实验）
        order: 28
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 慢牛研发经理. 你的天花板是 file_read / file_list / spec_query / task_read /
                task_draft / role_draft：需求与任务拆完之后，逐条判断这条任务该由什么岗位来做，
                例如 .NET 工程师、Vue 工程师、Python 工程师、安卓工程师。
                岗位是轻量定义：一个 id、一个显示名、一个必须继承的内置角色，外加可选的提示词前缀。
                用 role_draft 起草或更新岗位名册（.spec/roles.yaml），不要删除已有岗位；
                继承只能写内置角色，所以岗位不可能越过角色天花板。
                你不做分配这个动作：把建议的岗位与理由说清楚，请人用 /task_assign 写进任务。
                你不改代码、不跑命令、不签契约、不收口；缺工具就如实说，绝不假称已分配。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: manager

# ── 外壳 ─────────────────────────────────────────────────────
# 外壳自带左栏，所以禁用 DSH 原生 ui-sidebar；浏览器侧占用 main 的 lcoder-home。
- id: ui-sidebar
  disabled: true

# 首屏的账户登录整块去掉：本产品用 API key 接模型，不需要登录、配额与引导遮罩。
# 这一行同时挡掉 shell.overlay 上的 desktop-onboarding 与设置里的登录卡。
- id: ui-settings-account
  disabled: true

# 品牌侧去 DeepSeek：官方鲸标与名称字标不再出现在壳里（壳自画顶栏）。
- id: ui-brand-official
  disabled: true
# 默认模型走官网 DeepSeek；云端网关只作为可选路线，不改默认。
# 设置页里的「设为默认」仍会写回这条配置。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash


- insert:
    # 云端控制器全局在册：顶栏、门禁与模型请求共用一个令牌供应器。
    - id: lcoder-cloud
      name: '@maniu/kernel/cloud'
      config:
        baseUrl: !!js process.env.LCODER_CLOUD_BASE_URL || 'http://127.0.0.1:5091/v1'

    # 人才库宿主动态 preset：客户端提交云端人才列表，这里校验并注册成可选的 agent preset。
    - id: lcoder-talents
      name: '@maniu/kernel/talents'

    - id: ui-lcoder-workspace
      name: '@maniu/workspace'
      config:
        shell: true
