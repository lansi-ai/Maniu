      config:
        id: maniu-flow
        retiredIds: [lcoder-flow]
        name: 流程控制
        description: 只看任务与规格，说明下一步、理由与挡住原因（实验）
        order: 27
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
