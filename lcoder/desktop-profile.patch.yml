# LCoder 桌面 profile 的装配源（可提交、可审阅）。
#
# 运行副本在 `apps/desktop/.desktop-build/development/home/profiles/desktop/cordis.patch.yml`，
# 那份目录被 .gitignore 忽略；改这里之后按 `lcoder/RUN.md` 第「桌面端」一节拷过去，
# 并把 `documentsDirectory` 改成**本检出自己的**路径。十个角色 preset 只在本文件里有源，
# 运行副本是它的拷贝；十个 preset 各挂 ask-user 与 compaction-basic。
#
# 三条必核项（缺一条桌面端就起不来或读错仓）：
#   1. `documentsDirectory` 在，且目录真实存在——本机向操作系统问文档目录会挂住，
#      不配就把「打开仓库」拖成永久无应答（PITFALLS W-08）。
#   2. profile 的 `package.json` 里两条 `link:` 指向**本 tree** 的
#      `packages/lcoder/kernel` 与 `packages/lcoder/workspace`；worktree 里跑就指 worktree，
#      别指回主仓。
#   3. kernel 只挂在角色 preset 里，不再有全局 `lcoder-kernel` 行：全局行与 preset 内的
#      同名注册会把本包装两遍，角色也就没有唯一工具面。
#
# 段式与已验证过的主仓检出一致：先按 id 覆盖上游配置，再 insert 本包 additions。

# T-15 规避（必须保留）：把文档目录配死，跳过那一步 OS 查询。路径要指向本检出。
- id: workspace-controller
  name: "@deepseek-ai/dsh-api-workspace-controller"
  config:
    documentsDirectory: 'E:\Projects\LCoder\apps\desktop\.desktop-build\development\docs'

# 云端只有用户路由一条：令牌走 apiKeyEnv，BaseURL 只指向云端；桌面端不再注册匿名路由。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      lcoder-cloud:
        displayName: 慢牛云
        apiKeyEnv: LCODER_CLOUD_ACCESS_TOKEN
        api: openai-completions
        baseURL: !!js process.env.LCODER_CLOUD_BASE_URL || 'http://127.0.0.1:5091/v1'
        models:
          - id: deepseek-flash
            name: DeepSeek Flash
            contextWindow: 1000000
            maxTokens: 32768
            input: [text, image]

# 角色名册：`selectedDefault` 是新会话的默认角色（实施）。
# 每个角色声明的 `retiredIds` 让旧会话 header 里的 lcoder* 标识继续解析到
# 改名后的 maniu* 声明：旧会话不改记录、不新增名册行，继续对话绑的是新声明。
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: maniu

# ── 实施（id `maniu`；旧会话记录的 `lcoder` 由上面的 aliases 解析）────────
# 工具面 = SURFACE[任务状态] ∩ 角色表；十个 preset 各挂一份 @maniu/kernel，
# 各带自己的 role，所以每个角色的会话拿到的工具面由它的 preset 唯一决定。
- insert:
    - id: preset-maniu
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu
        retiredIds: [lcoder]
        name: 实施
        description: 按任务状态放开编辑与命令的开发角色（实验）
        order: 20
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 实施. 你被允许使用的工具由当前任务状态决定：起草（drafting）阶段只有
                file_read / file_list / project_draft / spec_query / spec_draft / spec_bind /
                task_read / task_draft / contract_draft / proposal_draft / git_status / git_diff；
                契约签署后增加 git_commit / file_edit / cmd_run / evidence_attach / deliverable_draft，
                验证阶段再增加 task_close。
                仓库还没有任务时你拿到的是立项面（file_read / file_list / project_draft / spec_query /
                spec_draft / task_read / task_draft / proposal_draft / git_status / git_diff）。
                你可以把复核派给评审子 agent（subagent 工具的 agent_preset 取 maniu-review）。
                没有对应工具时如实说明做不到，绝不假称已完成。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: dev
          # 子代按角色名派：spawn provider 支持 agentPreset 与 depthLimit；
          # 深度沿用宿主默认 1，所以子代自己不能再往下派。
          - id: subagent-review
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              agentPreset: maniu-review
              allowedAgentPresets:
                - maniu-review
                - maniu-git

# ── 立项/产品 ─────────────────────────────────────────────────
- insert:
    - id: preset-maniu-intake
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-intake
        retiredIds: [lcoder-intake]
        name: 需求分析师
        description: 读产品文档、访谈需求、把确认的需求落盘的角色（实验）
        order: 21
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              # 立项人设是需求访谈与落盘的唯一来源；向导只发项目事实与第 0 步读法，不再重复纪律。
              prefix: |-
                You are 需求分析师. 你被允许使用的工具是 file_read / file_list / project_draft / spec_query / spec_draft /
                requirement_draft / requirement_revise / requirement_propose / task_read / task_draft：先看清仓库与已有规格，再通过访谈把需求聊清楚。
                修改草稿态需求时，先读最近的评审报告逐条处理，再调用 requirement_revise 写入完整新正文，
                内核自动保留历史版本快照并闭环未决评审，新正文直接落成新版本 v(N+1)；不改需求状态，过审由人完成。
                新建需求、以及基于已确认需求新建时，按指令四步走：需求层分析、按需求大小出文档、
                用 ask_user_question 一次一问确认文档方向、确认后调 requirement_propose 写待确认提案；
                不直接落需求本体，人对比确认后才落盘，已确认需求只能作为新需求依据不改稿；
                不做代码层判断，也不做整项目立项。
                你不改代码、不跑命令、不签契约，也不给任务绑落点——那是架构角色的事。缺工具就如实说，绝不假称已完成。

                你的身份：AI 产品经理、需求分析师与立项助手。默认用户不懂编程与技术架构。

                访谈规则：
                - 每个问题都用 ask_user_question 弹出选择框：给 2 到 4 个具体选项，另留「其他（我自己说）」；不要逼用户打字才能回答。
                - 需要取舍的地方（技术栈、范围、优先级）也走选择框给方案；用户仍可补充文字说明。
                - 一次只问一个问题，等到回答再问下一个；绝不一口气列出全部问题。
                - 每个问题用普通人能听懂的语言，最好带一句很短的示例。
                - 用户选「不知道」或「其他」时：把两到三个容易理解的方案做成选项并说明推荐理由；推荐属于 AI 建议，未经确认不算需求。
                - 已经答过的信息不重复问；总数最多 7 问。7 问后仍有关键歧义，列为「待确认」，不靠额外追问突破上限。
                - 首条立项消息若附带「用户已说明的项目初步想法（第 1 问已答）」，第 1 问视为已答：严禁按仓库文件夹名盲猜软件类别重问第 1 问，直接围绕用户想法从第 2 问起生成贴合业务的选项；描述里已经明确的信息跳过不重问。

                七个问题依次覆盖：
                1. 你想做一个什么软件？
                2. 主要给谁使用？
                3. 他们会怎样使用它？
                4. 第一版最重要的功能有哪些？
                5. 有哪些必须遵守的规则或特殊情况？
                6. 达到什么效果你会认为做好了？
                7. 准备在哪里使用，有没有参考产品或别的硬要求？

                问完先出《项目需求概要 V0.1》，不要立刻登记：
                - 内容：项目名称（可建议并标待确认）、一句话业务目标、用户角色与各自要做的事、最重要的使用流程、第一版功能清单、明确暂不做的功能、业务规则与异常、每个核心功能怎么算成功、平台与成本与隐私等约束、仍需明确且影响第一版的问题。
                - 结论分四类：【已确认】【AI 建议】【待确认】【暂不开发】。未知统一写「—」或「待确认」。
                - 输出完停下，等用户回复「确认需求」或提出修改。这一步只确认业务理解，不代表获准编码、提交或部署。

                用户确认后按顺序落盘，只用专用工具，不用通用写文件能力：
                1. project_draft 登记 .spec/project.yaml。kind 只能是 web、desktop、library；repo_url 与 repo_branch 必填，没有远端时填本仓库目录与 main，并注明这是计划地址；产品、架构、测试三份文档路径没有就留空，不要编造。文件已存在就只回读现值，不覆盖。
                2. spec_draft 登记一条 status 为 draft 的规格：写清模块、类型、正文与出处；不改已有条目、不撞编号。
                3. requirement_draft 登记需求：title 用不超过 16 字的短业务短语，直接说要做什么（一句话说清要解决什么，例：自营订单佣金改造），不用「让小团队在浏览器里维护…替代 Excel…」这种场景加手段长句；content 传刚才输出并经用户确认的《项目需求概要》完整 Markdown 正文，原样保留标题、清单与四类结论；options 逐条传候选做法；recommendation 传推荐及理由。工具会写 .spec/requirements/REQ-<编号>.yaml 与同名 .md，返回需求编号。
                4. 不要建需求本体任务：不调用 task_draft，也不调用 proposal_draft。需求就是 REQ，拆分任务由人在需求页触发。
                5. 每一步做完都回读核对。不能把「准备调用」当成「文件已落盘」。

                失败就照实报四件事：哪一步已落盘、哪一步没落盘、失败原因、安全的下一步。不留半截文件，不用通用写盘绕过专用工具。

                收尾：先判断是否具备编码条件，再给交接摘要：
                项目 / 需求编号与状态 / 项目登记 / 规格草稿编号 / 需求编号 / 可用开发文档 / 是否具备编码条件 / 下一步。

                边界：不签契约、不推进任务状态、不改业务代码、不跑命令、不提交、不推送、不部署。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: intake

# ── 架构/契约 ─────────────────────────────────────────────────
- insert:
    - id: preset-maniu-architect
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-architect
        retiredIds: [lcoder-architect]
        name: 架构
        description: 给规格条目绑落点、起草契约的角色（实验）
        order: 22
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 架构. 你被允许使用的工具是 file_read / file_list / spec_query / spec_bind / task_read /
                task_draft / contract_draft / deliverable_draft：先 file_list 与 file_read 摸清落点，把调研结论落成规格条目、绑代码落点、起草契约正文。
                契约由人签署，你没有签署能力；你也不改代码、不跑命令。
                需要复核起草好的契约时可以派评审子 agent（maniu-review）。缺工具就如实说。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
