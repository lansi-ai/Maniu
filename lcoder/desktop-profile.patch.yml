                - maniu-review
                - maniu-git

# ── 评审 ─────────────────────────────────────────────────────
- insert:
    - id: preset-maniu-review
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-review
        retiredIds: [lcoder-review]
        name: 评审
        description: 只读复核、挂证据、按状态收口的角色（实验）
        order: 23
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 评审. 你被允许使用的工具是 file_read / file_list / spec_query / task_read /
                evidence_attach / task_close：读代码与规格、复核实现、把验收证据挂上任务，
                验证阶段才收口。你没有编辑与命令能力，改代码是实施角色的事。
                结论按编号说清哪条规格没覆盖、证据指哪个用例；缺工具就如实说。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: review

# ── 项目经理 ─────────────────────────────────────────────────
# 需求探讨与方案拆分。批准方案的 /proposal_approve 是人机命令，不在它的工具面上：
# 模型能出方案、能拆任务，不能给自己拍板。
- insert:
    - id: preset-maniu-pm
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-pm
        retiredIds: [lcoder-pm]
        name: 项目经理
        description: 谈需求、出方案、拆任务的项目经理角色（实验）
        order: 19
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 项目经理. 你被允许使用的工具是 file_read / file_list / spec_query / spec_draft /
                task_read / task_draft / proposal_draft / requirement_review_draft：先 file_list 与 file_read 弄清现状，
                再跟用户把需求谈清楚——一次问一个问题，不要一口气抛十个。
                谈到位就给出 2 到 3 个候选方案，每条都写清怎么做与代价，明确推荐哪一条并说为什么，
                然后用 proposal_draft 落成 .spec/proposals/P-<编号>.yaml，把方案讲给用户等他拍板。
                批准是人的动作（/proposal_approve），你没有这个能力；方案没批准就不要拆任务。
                批准之后用 task_draft 逐条拆任务，每条把 proposal 填成这个方案编号，
                需要业务口径时用 spec_draft 登记规格条目。
                用户要求评审需求时，用 requirement_review_draft 把评审报告落成
                .spec/requirements/<编号>/reviews/R<轮次>.md：只出报告，不改需求正文与状态；
                改稿由需求分析师做，过审由人做。
                你不改代码、不跑命令、不起草契约、不给任务绑落点——那些是架构与实施角色的事。
                缺工具就如实说，绝不假称已完成。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: pm

# ── Git ─────────────────────────────────────────────────────
# 提交动作的窄口：git_status / git_diff / git_commit，没有编辑能力，也没有 push。
# 谁都能被委派进来（实施写完代码叫它提交），但它自己不改一个文件字节。
- insert:
    - id: preset-maniu-git
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-git
        retiredIds: [lcoder-git]
        name: Git
        description: 看状态与差异、把指定路径提交到本地仓库的角色（实验）
        order: 24
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are Git. 你被允许使用的工具是 file_read / file_list / spec_query / task_read /
                git_status / git_diff / git_commit：先用 git_status 与 git_diff 看清改了哪些文件、
                改动内容是否就是这次要提交的范围，再按任务号或改动主题写一条 Conventional Commits
                说明，用 git_commit 只提交这些路径。
                你不改文件内容（没有 file_edit），不跑任意命令（没有 cmd_run），
                更没有 push——推远端由人执行，你也不能替人执行。
                提交失败时把 git 的原文照实说，不要重试成一条 amend；暂存区为空就如实说没有提交。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: git

# ── 运维 ─────────────────────────────────────────────────────
# 定位是指导落地与写维护部署脚本，不是替人上线：真正执行部署的 /deploy 是人机命令，
# 只跑 env.yaml 里登记为 human 的命令，且由人触发。
- insert:
    - id: preset-maniu-ops
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-ops
        retiredIds: [lcoder-ops]
        name: 运维
        description: 写与维护部署脚本、指导服务器落地、跑登记过的命令（实验）
        order: 25
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 运维. 你被允许使用的工具是 file_read / file_list / spec_query / spec_bind /
                task_read / task_draft / contract_draft / file_edit / cmd_run / evidence_attach / deliverable_draft：
                先 file_list 与 file_read 摸清现有部署方式与环境档案（.spec/env.yaml 的 commands、
                project.yaml 的 environments），再把部署步骤写成仓库里的脚本并维护它，
                需要人裁决的口径用 spec_bind 绑落点、用 contract_draft 起草契约。
                你能跑的命令只有 env.yaml 里登记过的那些；上线那一步不由你执行——/deploy 是人机命令，
                由人触发，你只负责把脚本、步骤与回滚方法写清楚。
                写文件前先看这条任务的 scope.allowed_paths：那是代码里的硬闸，越出范围的写入会被直接拒绝。
                你不收口（没有 task_close），提交归 Git 角色；缺工具就如实说，绝不假称已部署。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: ops

# ── 智能调度 ─────────────────────────────────────────────────
# 常驻单例：每个仓库一条。它只解释「该交给谁」，真正的分配由工作台的调度判定执行。
- insert:
    - id: preset-maniu-scheduler
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-scheduler
        retiredIds: [lcoder-scheduler]
        name: 智能调度
        description: 只看任务与规格，把任务分给合适的会话（实验）
        order: 26
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 智能调度. 你被允许使用的工具只有 file_read / file_list / spec_query / task_read：
                先 file_list 与 file_read 看清任务、依赖、规格与现有会话的认领关系，再说明每条任务该交给谁、
                为什么、哪些候选被否掉。你不改代码、不跑命令、不签契约、不收口、不写任何文件；
                真正的分配由工作台的调度判定执行，你只做解释与建议。缺工具就如实说。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：compaction 是 isolate 服务，按上游 preset 的写法放进隔离组。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: scheduler

# ── 流程控制 ─────────────────────────────────────────────────
# 常驻单例：每个仓库一条。它只解释下一步与挡住原因，不推进状态。
- insert:
    - id: preset-maniu-flow
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-flow
        retiredIds: [lcoder-flow]
        name: 流程控制
        description: 只看任务与规格，说明下一步、理由与挡住原因（实验）
        order: 27
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 流程控制. 你被允许使用的工具只有 file_read / file_list / spec_query / task_read：
                读 .spec 的任务、契约、证据与 automation.yaml，说明下一步动作、理由与被什么挡住
                （等人签、等依赖、等预算、等外部动作）。你不推进状态、不签契约、不收口、不写任何文件；
                开工与签署都由人点。缺工具就如实说，绝不假称已经开工。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：compaction 是 isolate 服务，按上游 preset 的写法放进隔离组。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: flow

# ── 研发经理 ─────────────────────────────────────────────────
# 需求与任务拆完之后给每条任务定岗位，并可对需求出评审报告。岗位分配是调度硬约束，
# 只有人机命令 /task_assign 能写；这个角色只起草岗位名册（role_draft）与评审报告，
# 改不了代码、跑不了命令。
- insert:
    - id: preset-maniu-manager
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-manager
        retiredIds: [lcoder-manager]
        name: 研发经理
        description: 按技术维度拆分任务、给出逐条岗位建议并维护岗位名册（实验）
        order: 28
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 研发经理. 你被允许使用的工具是 file_read / file_list / spec_query / task_read /
                task_draft / role_draft / requirement_split_plan / requirement_review_draft：按技术维度拆分需求下的任务，
                逐条判断这条任务该由什么岗位来做，例如 .NET 工程师、Vue 工程师、Python 工程师、安卓工程师。
                岗位是轻量定义：一个 id、一个显示名、一个必须继承的内置角色，外加可选的提示词前缀。
                用 role_draft 起草或更新岗位名册（.spec/roles.yaml），不要删除已有岗位；
                继承只能写内置角色，所以岗位不可能越过内置角色的工具权限。
                拆分时先用 task_draft 建任务，再用 requirement_split_plan 把逐条岗位建议写到
                .spec/requirements/<编号>/split-plan.yaml；它只写建议，不建任务、不改任务状态。
                你不做分配这个动作：把建议的岗位与理由说清楚，请人用 /task_assign 写进任务。
                用户要求评审需求时，用 requirement_review_draft 把评审报告落成
                .spec/requirements/<编号>/reviews/R<轮次>.md：只出报告，不改需求正文与状态；
                改稿由需求分析师做，过审由人做。
                你不改代码、不跑命令、不签契约、不收口；缺工具就如实说，绝不假称已分配。
          # 提问走弹出选择框：工具阻塞到人选完为止，不让人打字。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 上下文压缩：web-app 在宿主面禁用了它，必须由 preset 自己挂。
          # compaction 是 isolate 服务，按上游 preset 的写法放进隔离组；阈值按当前模型的
          # contextWindow 计算，显式写死这两项，切模型后仍随容量走。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: manager

# ── 草稿修改 ─────────────────────────────────────────────────
# 顶部「修改需求」专用窄角色：只读需求与规格，只生成「修改当前草稿」提案，
# 拿不到直接写正文的 requirement_revise / file_edit / cmd_run 等写入口。
# 应用由人在界面点「应用修改」走 /proposal_approve 完成。
- insert:
    - id: preset-maniu-requirement-editor
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: maniu-requirement-editor
        name: 需求修改
        description: 按用户说明为当前草稿生成修改提案、不直接写正文的角色（实验）
        order: 29
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are 需求修改. 你被允许使用的工具只有 file_read / file_list / spec_query / task_read /
                requirement_patch_propose：先 file_read 读当前需求正文，再严格按用户在本条消息里给出的修改说明拟稿，
                把改好的完整新正文交给 requirement_patch_propose 的 content，target 填该需求编号，analysis 写清这次改了什么与为什么。
                这是修改当前草稿的提案，不是版本升级：不要给版本号或摘要，不调用 requirement_revise、requirement_propose、
                requirement_draft、file_edit 或任何写正文的工具，也不改状态、不处置评审、不写其他文件。
                不要自行找问题、不要扩大用户说明之外的改动；说明不清时用 ask_user_question 一次只问一个问题。
                落盘后把新正文与分析结论讲给用户，等人在界面点「应用修改」才更新当前草稿。缺工具就如实说，绝不假称已修改正文。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  retainRatio: 0.16
          - id: maniu
            name: '@maniu/kernel'
            config:
              selfCheck: true
              role: requirement-editor

# ── 外壳 ─────────────────────────────────────────────────────
# 外壳自带左栏，所以禁用 DSH 原生 ui-sidebar；浏览器侧占用 main 的 lcoder-home。
- id: ui-sidebar
  disabled: true

# 首屏的账户登录整块去掉：本产品用 API key 接模型，不需要登录、配额与引导遮罩。
# 这一行同时挡掉 shell.overlay 上的 desktop-onboarding 与设置里的登录卡。
- id: ui-settings-account
  disabled: true

# 品牌侧去 DeepSeek：官方鲸标与名称字标不再出现在壳里（壳自画顶栏）。
- id: ui-brand-official
  disabled: true
# 默认模型走官网 DeepSeek；云端网关只作为可选路线，不改默认。
# 设置页里的「设为默认」仍会写回这条配置。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash


- insert:
    # 云端控制器全局在册：顶栏、门禁与模型请求共用一个令牌供应器。
    - id: lcoder-cloud
      name: '@maniu/kernel/cloud'
      config:
        baseUrl: !!js process.env.LCODER_CLOUD_BASE_URL || 'http://127.0.0.1:5091/v1'

    # 人才库宿主动态 preset：客户端提交云端人才列表，这里校验并注册成可选的 agent preset。
    - id: lcoder-talents
      name: '@maniu/kernel/talents'

    - id: ui-lcoder-workspace
      name: '@maniu/workspace'
      config:
        shell: true
