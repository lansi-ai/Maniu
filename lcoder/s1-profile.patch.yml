# T-187 S1 宿主 profile 追加层。
#
# 运行时由 `@lcoder/desktop` 的 HostSupervisor 落到 `<DSH_HOME>/profiles/s1/`：
# bundles 只取上游 `dsh-base` 与 `dsh-web-app`，本文件是它们之上的追加层。
# `__LCODER_S1_DOCUMENTS__` 由启动器替换成本仓内一个真实存在的目录——本机向
# 操作系统问文档目录会挂住（PITFALLS W-08），所以必须写死。
#
# 这里只装配 S1 需要的一条竖切：会话 API、agent 运行时与 `lcoderCloud` Remote。
# 不挂 LCoder 的十个角色 preset，也不改上游默认装配。

- id: workspace-controller
  name: "@deepseek-ai/dsh-api-workspace-controller"
  config:
    documentsDirectory: '__LCODER_S1_DOCUMENTS__'

# S1 的默认 provider 指向本机云端（mock 或真云端），这样无官网钥匙时
# 仍能跑出真实回合；地址仍由 LCODER_CLOUD_BASE_URL 覆盖。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      lcoder-cloud:
        displayName: 慢牛云
        apiKeyEnv: LCODER_CLOUD_ACCESS_TOKEN
        api: openai-completions
        baseURL: !!js process.env.LCODER_CLOUD_BASE_URL || 'http://127.0.0.1:5091/v1'
        models:
          - id: deepseek-flash
            name: DeepSeek Flash
            contextWindow: 1000000
            maxTokens: 32768
            input: [text, image]

- id: agent-default-model
  config:
    provider: lcoder-cloud
    model: deepseek-flash

- insert:
    - id: lcoder-cloud
      name: '@lcoder/kernel/cloud'
      config:
        baseUrl: !!js process.env.LCODER_CLOUD_BASE_URL || 'http://127.0.0.1:5091/v1'

    # 工作台作用域会话：只用来提供 `.spec` 基准与承托人机命令面。
    # 命令由 `@lcoder/kernel` 注册在该 preset 的 agent 作用域里；关掉工具自检，
    # 避免一条只跑命令的会话在宿主日志里刷工具面噪音。
    - id: preset-lcoder-workbench
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lcoder-workbench
        name: 慢牛工作台
        description: 只承托工作台人机命令的会话
        order: 30
        plugins:
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: lcoder
            name: '@lcoder/kernel'
            config:
              role: pm
              selfCheck: false
