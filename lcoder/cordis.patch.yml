# LCoder 自己的 patch 层。
#
# 两行：一行给宿主（agent 侧的工具），一行给浏览器（工作台页签）。上游的
# `packages/bundle/web-app/cordis.patch.yml` 一个字都不改——patch 是叠加的，
# 我们的层在 bundle 层之后应用，插入的行追加在清单末尾。
#
# 用法（在仓库根执行）：
#   pnpm dsh web --patch lcoder/cordis.patch.yml
#
# `@lcoder/kernel` 的规格根这样取：
#   1. 有会话时取 `session.header.cwd/.spec`——桌面端宿主 cwd 是 profile，
#      不是目标仓库，只有会话工作区才是正确来源；
#   2. 没有会话 cwd 时（headless、启动自检）用下面的 `root` 配置；
#   3. `root` 未设置时退回进程工作目录下的 `.spec`。
# `@lcoder/workspace` 没有配置面。它的 `dsh.client.inject` 声明在
# packages/lcoder/workspace/package.json 里，浏览器侧依赖顺序由它决定。

# 云端两条路由：用户令牌与匿名令牌各走一个 apiKeyEnv，宿主刷新出哪一条，
# 下一次请求就用哪一条。BaseURL 只指向云端；开发默认是本机 mock 5091。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      lcoder-cloud:
        displayName: 慢牛云
        apiKeyEnv: LCODER_CLOUD_ACCESS_TOKEN
        api: openai-completions
        baseURL: !!js process.env.LCODER_CLOUD_BASE_URL || 'http://127.0.0.1:5091/v1'
        models:
          - id: deepseek-flash
            name: DeepSeek Flash
            contextWindow: 1000000
            maxTokens: 32768
            input: [text, image]
      lcoder-cloud-guest:
        displayName: 慢牛云（匿名立项）
        apiKeyEnv: LCODER_CLOUD_GUEST_TOKEN
        api: openai-completions
        baseURL: !!js process.env.LCODER_CLOUD_BASE_URL || 'http://127.0.0.1:5091/v1'
        models:
          - id: deepseek-flash
            name: DeepSeek Flash
            contextWindow: 1000000
            maxTokens: 32768
            input: [text]

- insert:
    # 云端控制器必须全局在册：它在第一条会话出现之前就要给顶栏、门禁与模型请求
    # 提供同一个令牌供应器；角色 preset 里的 kernel 是懒装载，赶不上这一步。
    - id: lcoder-cloud
      name: '@lcoder/kernel/cloud'
      config:
        baseUrl: !!js process.env.LCODER_CLOUD_BASE_URL || 'http://127.0.0.1:5091/v1'

    # 人才库宿主动态 preset：客户端提交云端人才列表，这里校验并注册成可选的 agent preset。
    - id: lcoder-talents
      name: '@lcoder/kernel/talents'

    # 宿主侧：注册六个工具（规格/任务/编辑），工具面按当前任务状态收放。
    # `tools` 服务由 base 清单的 `- id: tools` 行提供，所以这一行能激活。
    - id: lcoder-kernel
      name: '@lcoder/kernel'
      config:
        # 部署可用环境变量指定无会话时的规格根；留空则用进程工作目录。
        root: !!js process.env.LCODER_SPEC_ROOT || undefined

    # 浏览器侧：右栏的工作台页签。数据走文件投影，读的是上面那个 kernel
    # 落盘的同一批 YAML（`.spec/tasks/*.yaml`、`.spec/spec/rules.yaml`）。
    - id: ui-lcoder-workspace
      name: '@lcoder/workspace'
